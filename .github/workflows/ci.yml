name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn audit:native-bridge:strict
      - run: yarn test
      - run: yarn build
      - run: yarn test:pack
      # Same staging the release-branches workflow pushes from main, without
      # the push. Fails on an exports/main entry that the packed output lacks.
      - name: Release branches dry run
        run: node scripts/build-release-branches.mjs --out "$RUNNER_TEMP/release-branches"

      # Phase G doctor self-smoke — verifies the built CLI binary runs
      # against a minimal fixture so a broken CLI can't ship from green
      # CI. The full example-app lint happens locally (see RELEASING.md)
      # since the example uses app.config.ts and doctor does not ship
      # with its own TypeScript transpilation pipeline.
      - name: Doctor self-smoke
        run: |
          mkdir -p /tmp/doctor-smoke
          cat > /tmp/doctor-smoke/app.config.json <<'JSON'
          {
            "expo": {
              "name": "smoke",
              "slug": "smoke",
              "plugins": [[
                "@expo-pico/core",
                { "xrMode": "pico-os6", "appType": "vr",
                  "platformService": { "picoAppId": "APP", "picoAppKey": "KEY" } }
              ]]
            }
          }
          JSON
          node packages/expo-pico-core/cli/build/doctor.js \
            --project /tmp/doctor-smoke --fail-on-warning

      # Advisory: report whether any changesets are pending so PR
      # authors see the impact on the next release before merge.
      # Not a gate — never fails the build.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: yarn changeset status --since=origin/${{ github.base_ref }} || true

  eskiu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      # Pinned eskiuc release, verified against a checksum committed in the script.
      - run: bash scripts/install-eskiuc.sh
      - run: node scripts/eskiu-doctor.mjs --strict
      # Every lucide-static icon, fetched from npm at the latest version.
      - run: node scripts/build-lucide-icons.mjs --all --out "$RUNNER_TEMP/lucide-icons.json"
      # Host tests (parser, arcs, stroke counts, Lucide meshes) plus the
      # aarch64-linux-android object compile, with PNGs of the curated icons.
      - run: node scripts/eskiu-icon-test.mjs --out "$RUNNER_TEMP/eskiu-icons" --all-icons "$RUNNER_TEMP/lucide-icons.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eskiu-icon-png
          path: ${{ runner.temp }}/eskiu-icons/png
          if-no-files-found: ignore

  example-android:
    runs-on: ubuntu-latest
    env:
      PICO_APP_ID: ci-placeholder-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yarn install --frozen-lockfile
      # With ESKIUC exported, the arm64 build compiles and links the Eskiu runtime.
      - run: bash scripts/install-eskiuc.sh
      - run: yarn example:prebuild:android
      - run: yarn example:assemble:mobile
      - run: yarn example:assemble:pico
      - name: Eskiu runtime is linked into the PICO APK
        run: |
          so=$(mktemp -d)
          unzip -o -q example/android/app/build/outputs/apk/pico/debug/app-pico-debug.apk \
            lib/arm64-v8a/libExpoPicoCore.so -d "$so"
          nm_bin=$(ls "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/*/bin/llvm-nm 2>/dev/null | head -1)
          nm_bin=${nm_bin:-$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-nm | tail -1)}
          "$nm_bin" -D --defined-only "$so/lib/arm64-v8a/libExpoPicoCore.so" | tee "$so/syms.txt" | grep -E 'expo_pico_icon_mesh_(size|fill)|iconMeshFill'
          grep -q ' T expo_pico_icon_mesh_fill' "$so/syms.txt"
