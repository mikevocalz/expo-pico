name: Refresh SDK 58 lockfile

on:
  push:
    branches:
      - codex/pico-cli-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Expo Horizon dependency
        uses: actions/checkout@v4
        with:
          repository: software-mansion-labs/expo-horizon
          ref: 725f3d2d1897f082a145c632dd4dfb3d25c2791f
          path: .vendor/expo-horizon
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - name: Regenerate workspace lockfile
        run: yarn install --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: sdk58-yarn-lock
          path: yarn.lock
          retention-days: 2
