name: Refresh SDK 58 lockfile

on:
  push:
    branches:
      - codex/pico-cli-bridge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile-pass]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - name: Regenerate workspace lockfile
        run: yarn install --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- yarn.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore(sdk58): refresh yarn.lock [lockfile-pass]"
          git push
