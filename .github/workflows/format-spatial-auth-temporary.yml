name: Format spatial auth PR (temporary)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/better-auth-xr-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn prettier --write 'packages/spatial-auth/**/*.{ts,js,json,md}' 'packages/expo-spatial-auth/**/*.{ts,js,json,md}' example/app.config.ts
      - name: Commit scoped formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/spatial-auth packages/expo-spatial-auth example/app.config.ts
          git commit -m "style(spatial-auth): apply project Prettier formatting"
          git push origin HEAD:${{ github.head_ref }}
