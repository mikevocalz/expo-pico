name: Format foundation branch

on:
  push:
    branches:
      - codex/pico-cli-bridge

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Expo Horizon dependency
        uses: actions/checkout@v4
        with:
          repository: software-mansion-labs/expo-horizon
          ref: 7071e63ee43092ea23a1d86c93ea14950d92edae
          path: .vendor/expo-horizon
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn prettier:check
