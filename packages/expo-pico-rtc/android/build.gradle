plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

android {
    namespace "expo.modules.pico.rtc"
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        missingDimensionStrategy "device", "pico", "mobile"
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {

}
