apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
}

android {
    namespace "com.example.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
}


// expo-pico-core: PICO Platform Service SDK (com.pico.pps:*) deps
//
// Declared once, here. No sibling @expo-pico/* package declares a
// com.pico.pps coordinate of its own, so installing more of them never
// produces a second declaration of the same artifact.
//
// Every service below depends on com.pico.pps:pps_sdk_base. The
// constraints block pins the whole pinned set — including services this
// app does not use — so that a declaration added anywhere else resolves
// to 1.0.0 instead of dragging a second SDK onto the classpath.
dependencies {
    constraints {
        implementation "com.pico.pps:pps_sdk_base:1.0.0"
        implementation "com.pico.pps:platform-service-achievement:1.0.0"
        implementation "com.pico.pps:platform-service-auth:1.0.0"
        implementation "com.pico.pps:platform-service-compliance:1.0.0"
        implementation "com.pico.pps:platform-service-entitlement:1.0.0"
        implementation "com.pico.pps:platform-service-friend:1.0.0"
        implementation "com.pico.pps:platform-service-iap:1.0.0"
        implementation "com.pico.pps:platform-service-leaderboard:1.0.0"
        implementation "com.pico.pps:platform-service-push:1.0.0"
        implementation "com.pico.pps:platform-service-social:1.0.0"
        implementation "com.pico.pps:platform-service-speech:1.0.0"
        implementation "com.pico.pps:platform-service-sport:1.0.0"
    }

    picoImplementation "com.pico.pps:platform-service-achievement:1.0.0"
    picoImplementation "com.pico.pps:platform-service-auth:1.0.0"
}


// expo-pico-core: auto-include app/libs/*.aar (PICO Platform SDK)
//
// Offline / air-gapped fallback. PICO's integration docs tell you to drop
// SDK AARs here, so the PPS artifacts resolved from Maven above are
// excluded by name — a local copy alongside the Maven one is what
// produces "Duplicate class com.pico.pps.… found in modules".
dependencies {
    picoImplementation fileTree(
        dir: 'libs',
        include: ['*.aar', '*.jar'],
        exclude: ['platform-service-*.aar', 'platform-service-*.jar', 'pps_sdk_base*.aar', 'pps_sdk_base*.jar', 'pps_platform_java_base*.aar', 'matrix_psf_api*.aar', 'coreservice.library*.aar', 'sdk.lib.annotations*.jar']
    )
}

// app: kept across prebuilds
ext.appOwned = true
