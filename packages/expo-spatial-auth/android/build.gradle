plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spatialauth'
version = '0.1.0'

def safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "expo.modules.spatialauth"
    compileSdk safeExtGet('compileSdkVersion', 36)
    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        missingDimensionStrategy "device", "mobile"
    }
    buildFeatures { buildConfig true }
}

dependencies {
    // Native compilation only. The config plugin adds Meta runtime classes
    // into QUEST builds, never into PICO/mobile.
    compileOnly "com.meta.horizon.platform.sdk:core-kotlin:0.2.2"
    compileOnly "com.meta.horizon.platform.sdk:users-kotlin:0.2.2"

    // Latest stable Credential Manager and Google ID at 2026-10-12.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
}
